# Alembic configuration for Atlas AI Trader.
# The database URL is NOT stored here: backend/alembic/env.py reads it from the
# validated ATLAS_* settings so credentials never live in a committed file.

[alembic]
script_location = %(here)s/backend/alembic
prepend_sys_path = %(here)s/backend
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 60
timezone = UTC
path_separator = os

# Logging is configured by Atlas (structured JSON) in env.py.
