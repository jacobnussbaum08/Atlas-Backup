# Atlas AI Trader — local development stack (paper trading only).
#
#   docker compose up --build            start everything (migrations run first)
#   docker compose down                  stop (data volume is kept)
#   docker compose --profile test run --rm backend-tests   full backend test suite
#
# All published ports bind to 127.0.0.1 only.

name: atlas

x-backend-env: &backend-env
  ATLAS_POSTGRES_HOST: postgres
  ATLAS_POSTGRES_PORT: "5432"
  ATLAS_REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${ATLAS_POSTGRES_DB:?set ATLAS_POSTGRES_DB in .env}
      POSTGRES_USER: ${ATLAS_POSTGRES_USER:?set ATLAS_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${ATLAS_POSTGRES_PASSWORD:?set ATLAS_POSTGRES_PASSWORD in .env}
      TZ: UTC
      PGTZ: UTC
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 30s

  redis:
    image: redis:7.4-bookworm
    # Transient state only (spec 3.2): no RDB/AOF persistence.
    environment:
      ATLAS_REDIS_PASSWORD: ${ATLAS_REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - exec redis-server --save '' --appendonly no $${ATLAS_REDIS_PASSWORD:+--requirepass "$$ATLAS_REDIS_PASSWORD"}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$ATLAS_REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: base
    image: atlas-backend:dev
    env_file: .env
    environment: *backend-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: atlas-backend:dev
    env_file: .env
    environment:
      <<: *backend-env
      ATLAS_API_HOST: 0.0.0.0
      ATLAS_API_PORT: "8000"
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    # ML model artifacts (Phase 5A): written by `docker compose run --rm backend python -m
    # app.ml_engine.cli train ...`, read (sha256-checked) by inference and replay.
    volumes:
      - ml-artifacts:/srv/atlas/data/ml/artifacts
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 20s

  # Live market-data stream (Deliverable 2C). One process per provider/feed, enforced by a
  # PostgreSQL advisory lock. With MARKET_DATA_STREAM_ENABLED=false (the default) it
  # records DISABLED and exits 0, so it is not restarted. On a permanent failure (e.g.
  # rejected credentials) it stays up reporting FAILED instead of retrying.
  stream-worker:
    image: atlas-backend:dev
    env_file: .env
    environment: *backend-env
    command: ["python", "-m", "app.workers.market_data_stream"]
    # The image's HEALTHCHECK probes the API's HTTP port, which this worker does not serve.
    # Stream health is derived from the worker's heartbeat: GET /api/v1/market-data/stream.
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure
    stop_grace_period: 30s

  recovery-worker:
    image: atlas-backend:dev
    env_file: .env
    environment: *backend-env
    command: ["python", "-m", "app.workers.market_data_recovery"]
    # No HTTP port either; health: GET /api/v1/market-data/pipeline-health.
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure
    stop_grace_period: 30s

  # Asset discovery (Phase 3A): scheduled directory discovery, metadata refresh,
  # qualification and watchlist scoring. Off by default (ASSET_DISCOVERY_ENABLED=false):
  # it then exits 0 and is not restarted. Several may run safely (jobs are claimed with
  # SKIP LOCKED, one active job per kind). Status: GET /api/v1/discovery/jobs.
  discovery-worker:
    image: atlas-backend:dev
    env_file: .env
    environment: *backend-env
    command: ["python", "-m", "app.workers.asset_discovery"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure
    stop_grace_period: 30s

  # Real-time news (Phase 3C): one connection per news provider (advisory lock), separate
  # from the market-data stream-worker. With NEWS_STREAM_ENABLED=false (the default) it
  # records DISABLED and exits 0. After every (re)connection it recovers an overlapping
  # window over REST. Status: GET /api/v1/news/stream.
  news-worker:
    image: atlas-backend:dev
    env_file: .env
    environment: *backend-env
    command: ["python", "-m", "app.workers.news_stream"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure
    stop_grace_period: 45s

  # Strategy evaluation (proposals only; no orders). Off unless STRATEGY_WORKER_ENABLED=true.
  strategy-worker:
    image: atlas-backend:dev
    env_file: .env
    environment: *backend-env
    command: ["python", "-m", "app.workers.strategy_evaluation"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure
    stop_grace_period: 75s

  # Decision coordinator and asynchronous LLM analysis (Phase 5B; no orders). Each loop is
  # off unless AI_DECISIONS_ENABLED / AI_NEWS_ANALYSIS_ENABLED /
  # AI_CONFLICT_EXPLANATIONS_ENABLED; with all off it exits 0.
  ai-worker:
    image: atlas-backend:dev
    env_file: .env
    environment: *backend-env
    command: ["python", "-m", "app.workers.ai_engine"]
    volumes:
      - ml-artifacts:/srv/atlas/data/ml/artifacts:ro
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure
    stop_grace_period: 75s

  # Isolated paper broker (Phases 7A-7B): outbox delivery, simulated fills from stored
  # market data, expiry. Simulated only: no brokerage connection, credential or live mode.
  paper-execution-worker:
    image: atlas-backend:dev
    env_file: .env
    environment: *backend-env
    command: ["python", "-m", "app.workers.paper_execution"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure
    stop_grace_period: 30s

  # Position monitor (Phase 7B): marks, protective exits, take-profits, borrow accruals of
  # simulated paper positions. Exits are simulated paper orders through the engine above.
  position-monitor-worker:
    image: atlas-backend:dev
    env_file: .env
    environment: *backend-env
    command: ["python", "-m", "app.workers.position_monitor"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure
    stop_grace_period: 30s

  # Trading orchestrator (Phase 10A): strategies -> AI decisions -> risk reservations ->
  # simulated paper entry orders, plus scheduled risk monitoring and reconciliations. Off
  # unless ORCHESTRATOR_WORKER_ENABLED=true (it then exits 0). Running it does NOT enable
  # trading: new entries also need the operator control ENABLED (python -m
  # app.orchestration.cli enable --actor operator:<name> --reason ...), DISABLED by default.
  # Needs paper-execution-worker and position-monitor-worker for fills and exits.
  orchestrator-worker:
    image: atlas-backend:dev
    env_file: .env
    environment: *backend-env
    command: ["python", "-m", "app.workers.trading_orchestrator"]
    volumes:
      - ml-artifacts:/srv/atlas/data/ml/artifacts:ro
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure
    stop_grace_period: 90s

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    environment:
      ATLAS_BACKEND_URL: http://backend:8000
      ATLAS_FRONTEND_HOST: 0.0.0.0
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:5173"
    depends_on:
      - backend
    restart: unless-stopped

  backend-tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: dev
    env_file: .env
    environment:
      <<: *backend-env
      ATLAS_TEST_DATABASE_URL: postgresql+psycopg://${ATLAS_POSTGRES_USER}:${ATLAS_POSTGRES_PASSWORD}@postgres:5432/postgres
      ATLAS_TEST_REDIS_URL: redis://redis:6379/15
      ATLAS_REQUIRE_INTEGRATION: "1"
    command: ["pytest"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  ml-artifacts:
