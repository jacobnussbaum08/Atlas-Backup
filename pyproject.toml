[project]
name = "atlas-ai-trader"
version = "0.1.0"
description = "Atlas AI Trader - autonomous multi-market quantitative paper-trading research platform (paper trading only)."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "structlog>=24.4",
    "httpx>=0.28",
    "websockets>=15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["backend/app/tests"]
pythonpath = ["backend"]
addopts = "-ra --strict-markers --strict-config -m 'not live'"
markers = [
    "integration: requires a real PostgreSQL server (ATLAS_TEST_DATABASE_URL)",
    "redis: requires a real Redis server (ATLAS_TEST_REDIS_URL)",
    "live: calls a real market-data provider; opt-in (ATLAS_LIVE_PROVIDER_TESTS=1, run with -m live)",
]
filterwarnings = [
    "error::DeprecationWarning:app.*",
    # Starlette recommends a successor to httpx for TestClient; not adopted yet (see docs/decisions.md).
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DTZ", "RUF", "SIM", "PT"]
ignore = []

[tool.ruff.lint.isort]
# backend/alembic (migration scripts) would otherwise shadow the alembic package.
known-third-party = ["alembic"]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts, fixed test credentials, and literal SQL built from test parameters.
"backend/app/tests/**" = ["S101", "S105", "S106", "S108", "S608"]
"backend/alembic/**" = ["E501"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
packages = ["app"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["app.tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["backend/app"]
omit = ["backend/app/tests/*"]
